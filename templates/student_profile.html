{% extends "base.html" %}
{% block title %}Student Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h4 mb-3">Student Profile</h2>
                <form method="post" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" name="name" value="{{ current_user.name }}" required></div>
                        <div class="col-md-6"><label class="form-label">Contact</label><input class="form-control" name="contact" value="{{ current_user.contact or '' }}"></div>
                        <div class="col-md-6"><label class="form-label">Department</label><input class="form-control" name="department" value="{{ current_user.department or '' }}"></div>
                        <div class="col-md-3"><label class="form-label">CGPA</label><input class="form-control" type="number" step="0.01" min="0" max="10" name="cgpa" value="{{ current_user.cgpa if current_user.cgpa is not none else '' }}"></div>
                        <div class="col-md-3"><label class="form-label">Graduation Year</label><input class="form-control" type="number" min="2020" max="2100" name="grad_year" value="{{ current_user.grad_year or '' }}"></div>
                        <div class="col-12">
                            <label class="form-label">Resume (PDF/DOC/DOCX)</label>
                            <input class="form-control" type="file" name="resume" accept=".pdf,.doc,.docx">
                            {% if current_user.resume_filename %}
                                <small class="text-muted">Current: <a href="{{ url_for('download_resume', filename=current_user.resume_filename) }}">{{ current_user.resume_filename }}</a></small>
                            {% endif %}
                        </div>
                    </div>
                    <button class="btn btn-primary mt-3" type="submit">Save</button>
                    <a class="btn btn-outline-secondary mt-3" href="{{ url_for('student_dashboard') }}">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
