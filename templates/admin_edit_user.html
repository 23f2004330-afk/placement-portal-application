{% extends "base.html" %}
{% block title %}Edit User{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h4 mb-3">Edit {{ user.role|capitalize }}: {{ user.name }}</h2>
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Name</label>
                            <input class="form-control" type="text" name="name" value="{{ user.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" name="email" value="{{ user.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contact</label>
                            <input class="form-control" type="text" name="contact" value="{{ user.contact or '' }}">
                        </div>

                        {% if user.role == 'student' %}
                        <div class="col-md-6">
                            <label class="form-label">Department</label>
                            <input class="form-control" type="text" name="department" value="{{ user.department or '' }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">CGPA</label>
                            <input class="form-control" type="number" step="0.01" min="0" max="10" name="cgpa" value="{{ user.cgpa if user.cgpa is not none else '' }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Graduation Year</label>
                            <input class="form-control" type="number" min="2020" max="2100" name="grad_year" value="{{ user.grad_year or '' }}">
                        </div>
                        {% else %}
                        <div class="col-md-6">
                            <label class="form-label">Website</label>
                            <input class="form-control" type="url" name="website" value="{{ user.website or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">HR Contact</label>
                            <input class="form-control" type="text" name="hr_contact" value="{{ user.hr_contact or '' }}">
                        </div>
                        <div class="col-md-6 form-check mt-4 ms-3">
                            <input class="form-check-input" type="checkbox" id="approved" name="approved" {% if user.approved %}checked{% endif %}>
                            <label class="form-check-label" for="approved">Approved</label>
                        </div>
                        {% endif %}
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Save</button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('admin_dashboard') }}">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
