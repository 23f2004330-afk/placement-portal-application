{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h4 mb-3">Student Registration</h2>
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input class="form-control" type="text" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" name="email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input class="form-control" type="password" name="password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contact</label>
                            <input class="form-control" type="text" name="contact">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Department</label>
                            <input class="form-control" type="text" name="department">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">CGPA</label>
                            <input class="form-control" type="number" step="0.01" min="0" max="10" name="cgpa">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Graduation Year</label>
                            <input class="form-control" type="number" min="2020" max="2100" name="grad_year">
                        </div>
                    </div>
                    <button class="btn btn-success mt-3" type="submit">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
